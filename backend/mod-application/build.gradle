plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'application'
}

springBoot {
    mainClass.set('org.tailkeep.TailkeepApplication')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

compileJava {
    options.compilerArgs << '-parameters'
}

// Packages the web app when it has been built. The Dockerfile always builds it,
// and the tests don't need it.
processResources {
    from(rootProject.file('../web/dist')) {
        into 'static'
    }
}

// Only the Spring Boot jar is wanted in build/libs, so the Dockerfile can copy it by pattern.
jar {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation 'jakarta.validation:jakarta.validation-api'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.flywaydb:flyway-core:11.1.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.1.0'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    testImplementation 'org.testcontainers:testcontainers-bom:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:redpanda'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.apache.httpcomponents.core5:httpcore5:5.3.1'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
}

tasks.named('test') {
    useJUnitPlatform()
    // Downloader reads the size of the downloaded file from this directory
    def testMedia = layout.buildDirectory.dir('tmp/test-media').get().asFile
    doFirst { testMedia.mkdirs() }
    environment 'MEDIA_PATH', testMedia.absolutePath
}

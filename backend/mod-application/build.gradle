plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'application'
}

springBoot {
    mainClass.set('org.tailkeep.TailkeepApplication')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Packages the web app when it has been built. The Dockerfile always builds it,
// and the tests don't need it.
processResources {
    from(rootProject.file('../web/dist')) {
        into 'static'
    }
}

// Only the Spring Boot jar is wanted in build/libs, so the Dockerfile can copy it by pattern.
jar {
    enabled = false
}

dependencies {
    implementation project(':mod-domain')
    implementation project(':mod-adapter:database')
    implementation project(':mod-adapter:web')
    implementation project(':mod-adapter:security')
    implementation project(':mod-adapter:messaging')
    implementation project(':mod-adapter:ytdlp')
    runtimeOnly project(':mod-adapter:database-migration')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation 'jakarta.validation:jakarta.validation-api'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.flywaydb:flyway-core:11.1.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.1.0'

    testImplementation 'org.testcontainers:testcontainers-bom:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:redpanda'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.apache.httpcomponents.core5:httpcore5:5.3.1'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
}

tasks.named('test') {
    // app.media.path in application-test.properties points here: the fake yt-dlp writes the video file
    // and the ytdlp adapter reads its size
    def testMedia = layout.buildDirectory.dir('tmp/test-media').get().asFile
    doFirst { testMedia.mkdirs() }
}
